<!DOCTYPE html>
<html lang="ca">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAS CC — Registre d'evidències</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1117; --surface:#181c27; --surface-2:#1f2433; --surface-3:#262c3d;
    --border:#2b3142; --text:#e7eaf3; --muted:#8b93a7;
    --accent:#4f8ef7; --accent-soft:rgba(79,142,247,.14); --accent-2:#7aa9ff;
    --green:#3fb27f; --amber:#e0a23c; --red:#e25563; --grey:#6b7280;
    --radius:14px; --radius-sm:9px; --shadow:0 12px 40px -12px rgba(0,0,0,.6);
    --header-bg:rgba(15,17,23,.85); --grid:rgba(255,255,255,.08); --axis:rgba(255,255,255,.12); --glow:rgba(79,142,247,.10);
    --ring:#ffffff; --stripe-a:#3a4154; --stripe-b:#2c3245;
    --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'DM Sans',system-ui,sans-serif;
  }
  body.light{
    --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f7; --surface-3:#e4e9f2;
    --border:#d7dde8; --text:#1b2233; --muted:#5d6577;
    --accent:#2f6fd6; --accent-soft:rgba(47,111,214,.12); --accent-2:#2f6fd6;
    --shadow:0 12px 30px -14px rgba(20,30,60,.22);
    --header-bg:rgba(255,255,255,.88); --grid:rgba(20,30,60,.10); --axis:rgba(20,30,60,.14); --glow:rgba(79,142,247,.07);
    --ring:#1b2233; --stripe-a:#c6cdda; --stripe-b:#dde3ee;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5;
    background-image:radial-gradient(900px 500px at 85% -10%,var(--glow),transparent 60%);background-attachment:fixed}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer} input,select{font-family:inherit}
  .mono{font-family:var(--mono)}
  #errorBar{position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--red);color:#fff;padding:11px 18px;font-size:14px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  #errorBar.show{display:flex;gap:12px;align-items:flex-start}
  #errorBar .x{margin-left:auto;cursor:pointer;font-weight:700}
  #errorBar code{font-family:var(--mono);font-size:12.5px;color:#ffe1e4;word-break:break-word}

  #login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .card-login{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:34px 30px;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .brand .dot{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#2f6fd6);display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:#fff;font-size:14px;box-shadow:0 6px 18px -4px var(--accent)}
  .brand h1{font-size:18px}
  .sub{color:var(--muted);font-size:13.5px;margin:2px 0 22px}
  label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
  .field{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:var(--radius-sm);font-size:15px;outline:none;transition:border .15s,box-shadow .15s}
  .field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  select.inline{width:auto;display:inline-block}
  .btn{background:var(--accent);color:#fff;border:none;padding:12px 16px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;width:100%;margin-top:20px;transition:filter .15s,transform .05s}
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
  .btn.sm{width:auto;margin:0;padding:9px 14px;font-size:13.5px}
  .btn.ghost{background:var(--surface-2);border:1px solid var(--border);color:var(--text)}
  .btn.ghost:hover{background:var(--surface-3);filter:none}
  .btn.danger{background:var(--red)}
  .quick{margin-top:24px;border-top:1px solid var(--border);padding-top:18px}
  .quick p{color:var(--muted);font-size:12px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em}
  .quick-row{display:flex;gap:8px}.quick-row .btn{margin:0;flex:1;font-size:13px;padding:10px 8px}
  #pingStatus{margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--muted);min-height:16px}

  #app{display:none;min-height:100%;flex-direction:column}
  header.top{position:sticky;top:0;z-index:50;background:var(--header-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:0 22px;display:flex;align-items:center;gap:14px;height:58px;flex-wrap:wrap}
  header.top .brand{margin:0}.header.top .brand h1{font-size:15px}
  .nav{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap;align-items:center}
  .nav button{background:transparent;border:none;color:var(--muted);padding:9px 13px;border-radius:9px;font-size:13.5px;font-weight:500;transition:.15s;cursor:pointer}
  .nav button:hover{color:var(--text);background:var(--surface-2)}
  .nav button.active{color:var(--accent-2);background:var(--accent-soft)}
  .nav-group{position:relative;display:inline-flex}
  .nav-group>.nav-gBtn{display:flex;align-items:center;gap:4px}
  .nav-group>.nav-gBtn::after{content:'▾';font-size:10px;opacity:.55;margin-left:1px}
  .nav-dropdown{display:none;position:absolute;top:calc(100% + 5px);left:0;min-width:152px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.14);z-index:200;padding:4px}
  .nav-group:hover .nav-dropdown,.nav-group:focus-within .nav-dropdown{display:block}
  .nav-dropdown button{display:block;width:100%;text-align:left;border-radius:7px;padding:8px 12px;font-size:13px;white-space:nowrap}
  .nav-group.active>.nav-gBtn{color:var(--accent-2);background:var(--accent-soft)}
  .userbox{margin-left:auto;display:flex;align-items:center;gap:10px}
  .userbox .who{text-align:right;line-height:1.2}.userbox .who .n{font-size:13px;font-weight:600}.userbox .who .r{font-size:11px;color:var(--muted);text-transform:uppercase}
  .modepill{font-family:var(--mono);font-size:11px;color:var(--accent-2);background:var(--accent-soft);padding:3px 9px;border-radius:20px;cursor:pointer}
  main{padding:24px 22px 70px;max-width:1040px;margin:0 auto;width:100%}

  .page-title{font-size:22px;margin-bottom:4px}.page-sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
  .panel.scrollable{max-height:calc(100vh - 280px);overflow-y:auto;overflow-x:hidden}
  .panel h3{font-size:15px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.spacer{flex:1}
  .muted{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:30px;font-size:14px}
  .cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .stat .k{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1}.stat .l{color:var(--muted);font-size:12.5px;margin-top:7px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  tbody tr:hover{background:var(--surface-2)}
  .two-col{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
  @media(max-width:820px){.two-col{grid-template-columns:1fr}}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:12px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px}.legend i{width:11px;height:11px;border-radius:3px}
  canvas{max-width:100%}
  /* help fab */
  #helpFab{position:fixed;bottom:22px;right:22px;z-index:999;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:20px;font-weight:700;box-shadow:0 4px 18px -4px rgba(79,142,247,.65);cursor:pointer;display:none;align-items:center;justify-content:center;transition:transform .15s,filter .15s;line-height:1}
  #helpFab:hover{transform:scale(1.1);filter:brightness(1.12)}
  #helpFab:active{transform:scale(.96)}
  #helpFab title{display:none}
  .distbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0}
  .distbar i{display:block;height:100%}

  /* wizard */
  .crumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;font-size:13px}
  .crumb{background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:5px 13px;color:var(--muted);cursor:pointer;transition:.12s}
  .crumb.on{color:var(--accent-2);border-color:var(--accent);background:var(--accent-soft)}.crumb.done{color:var(--text)}
  .crumb.muted{opacity:.45;font-style:italic}
  .step-title{font-size:21px;margin-bottom:4px}.step-sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  .opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .opt{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;cursor:pointer;transition:.14s;text-align:left}
  .opt:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
  .opt .big{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--accent-2)}
  .opt .t{font-size:15px;font-weight:600;margin-top:2px;color:var(--text)}.opt .d{font-size:12.5px;color:var(--muted);margin-top:4px}
  .indtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .indtab{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:9px 13px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;transition:.12s}
  .indtab .swatch{width:11px;height:11px;border-radius:3px;flex:none}
  .indtab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}
  .indtab.ok{border-color:var(--green)}.indtab.ok .prog{color:var(--green)}
  .btn:disabled{opacity:.5;cursor:not-allowed;filter:none}.btn:disabled:hover{filter:none;transform:none}
  .capacc{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .capwrap{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface-2)}
  .capHead{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:none;color:var(--text);padding:11px 13px;font-size:14px;font-weight:600;text-align:left}
  .capHead .arrow{color:var(--muted);font-size:12px;width:12px}
  .capHead .cn{flex:1}
  .capHead .badge{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent-2);padding:2px 8px;border-radius:20px}
  .capBody{padding:4px 13px 12px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--border)}
  .indpick{display:flex;align-items:center;gap:9px;padding:7px 4px;font-size:13.5px;cursor:pointer;border-radius:6px}
  .indpick:hover{background:var(--surface-3)}
  .indpick input{width:16px;height:16px;flex:none;cursor:pointer}
  .indpick .swatch{width:11px;height:11px;border-radius:3px;flex:none}
  .indpick .code{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--accent-2);flex:none}
  .indtab .code{font-family:var(--mono);font-weight:600}.indtab .prog{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .ind-desc{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:11px 14px;font-size:13.5px;margin-bottom:14px}
  .ind-desc .cap{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}
  .ind-kw{font-size:12.5px;padding:5px 9px;margin:2px 0 5px 28px;width:calc(100% - 36px);border-radius:6px;background:var(--surface-3);border:1px solid var(--border);color:var(--text);display:block}
  .ind-kw:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
  .kws{font-size:14px;color:var(--text-2);letter-spacing:.02em;margin-bottom:4px}
  .btn-link{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12.5px;padding:4px 0;display:inline-block}
  .gbtns{display:flex;gap:7px}
  .gbtn{width:34px;height:32px;border-radius:8px;border:2px solid transparent;background:var(--surface-3);transition:.1s;cursor:pointer}
  .gbtn:hover{transform:scale(1.08)} .gbtn.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ring)}
  .gbtn.na{background:repeating-linear-gradient(45deg,var(--stripe-a),var(--stripe-a) 5px,var(--stripe-b) 5px,var(--stripe-b) 10px)}
  .student-line{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--border)}
  .student-line .nm{flex:1;font-size:14px}
  .student-line.off{opacity:.55}.student-line.off .nm{text-decoration:line-through}
  .ntag{font-size:10.5px;background:var(--surface-3);color:var(--muted);padding:2px 7px;border-radius:5px;margin-left:8px;text-decoration:none;display:inline-block}
  .ptag{font-size:10.5px;background:rgba(224,162,60,.18);color:#f0c074;padding:2px 7px;border-radius:5px;margin-left:8px}
  .subhead{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 6px}
  .allrow{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:6px}
  .counter{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  /* resum grid */
  .cell{width:30px;height:26px;border-radius:6px;display:inline-block;background:var(--surface-3)}
  .cell.empty{background:repeating-linear-gradient(45deg,var(--stripe-a),var(--stripe-a) 4px,var(--stripe-b) 4px,var(--stripe-b) 8px)}
  td.cc{text-align:center}
  .opt.center{text-align:center;display:grid;place-items:center;min-height:88px}
  .opt.center .big{font-size:30px}
  @media(max-width:680px){
    header.top{height:auto;padding:8px 14px;gap:8px}
    .nav{order:3;width:100%;margin-left:0;justify-content:flex-start}
    .userbox{margin-left:auto;gap:8px}
    .userbox .who{display:none}
    main{padding:18px 14px 70px}
    .gbtn{width:38px;height:36px}
    .opts{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
    .panel.scrollable{max-height:calc(100vh - 340px)}
  }
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:10px;z-index:500;font-size:14px;box-shadow:var(--shadow);display:none;max-width:90%}
  .toast.show{display:block}
  .overlay{position:fixed;inset:0;background:rgba(8,9,13,.7);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:460px;padding:24px;box-shadow:var(--shadow);max-height:85vh;overflow-y:auto}
  .modal .actions{display:flex;gap:10px;margin-top:20px}.modal .actions .btn{margin:0}
  @media(max-width:520px){.overlay{padding:10px}.modal{padding:16px;border-radius:10px}}
  /* ---- Exemples pràctics ---- */
  .ex-opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .ex-opt{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:6px;transition:.14s;cursor:pointer;width:100%;font-family:inherit}
  .ex-opt:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
  .ex-opt .big{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--accent-2);line-height:1.1}
  .ex-opt.mg .big{color:#a78bfa}
  .ex-opt .t{font-size:15px;font-weight:600}
  .ex-opt .d{font-size:12.5px;color:var(--muted)}
  .ex-opt .foot{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
  .ex-opt .foot b{font-family:var(--mono);color:var(--text);font-weight:600}
  .ex-kind{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px;white-space:nowrap}
  .ex-kind.mp{background:var(--accent-soft);color:var(--accent-2)}
  .ex-kind.mg{background:rgba(167,139,250,.15);color:#a78bfa}
  .ex-mps{display:flex;flex-wrap:wrap;gap:4px}
  .ex-mps span{font-family:var(--mono);font-size:11px;background:var(--surface-3);border-radius:5px;padding:1px 6px;color:var(--muted)}
  .ex-course{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .ex-course-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .ex-course-h h3{font-size:15px;font-weight:600;margin:0}
  #exemOverlay{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;background:#000}
  #exemOverlay.show{display:flex}
  #exemBar{height:46px;background:#0d1f24;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:12px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08)}
  #exemActTitle{font-size:13px;font-weight:600;color:#cddde0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #exemBarRight{display:flex;align-items:center;gap:8px;flex-shrink:0}
  #exemPptBtn{font-size:12px;padding:5px 11px;border-radius:6px;background:rgba(0,168,176,.2);color:#00c8d0;text-decoration:none;white-space:nowrap;border:1px solid rgba(0,200,208,.25)}
  #exemCloseBtn{background:transparent;border:none;color:rgba(255,255,255,.5);font-size:22px;cursor:pointer;padding:2px 6px;line-height:1}
  #exemCloseBtn:hover{color:#fff}
  #exemOverlay iframe{flex:1;width:100%;border:0;min-height:0}
  /* Chips */
  .ex-mod{margin-bottom:8px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .ex-mod-h{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none;flex-wrap:wrap;background:var(--card)}
  .ex-mod-h:hover{background:var(--hover)}
  .ex-mod-toggle{margin-left:auto;font-size:13px;opacity:.5;transition:transform .2s;flex-shrink:0}
  .ex-mod.open .ex-mod-toggle{transform:rotate(180deg)}
  .ex-mod-codi{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--accent)}
  .ex-mod-nom{font-size:13.5px;font-weight:500;color:var(--text)}
  .ex-chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-top:1px solid var(--border)}
  .ex-mod:not(.open) .ex-chips{display:none}
  .ex-chip{border:none;border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;min-width:68px;transition:transform .15s,box-shadow .15s;line-height:1.3}
  .ex-chip:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.25)}
  .ex-chip-a{background:var(--accent-soft);color:var(--accent)}
  .ex-chip-b{background:rgba(251,191,36,.12);color:#ca8a04}
  @media(prefers-color-scheme:dark){.ex-chip-b{color:#fbbf24}}
  .ex-chip-label{display:block;font-size:17px;font-weight:800;margin-bottom:2px}
  .ex-chip-title{display:block;font-size:11px;line-height:1.3;opacity:.75;max-width:120px}
  /* Admin new */
  .exem-admin-mod{margin-bottom:8px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .exem-admin-mod-h{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none;background:var(--card)}
  .exem-admin-mod-h:hover{background:var(--hover)}
  .exem-admin-mod-toggle{margin-left:auto;font-size:13px;opacity:.5;transition:transform .2s;flex-shrink:0}
  .exem-admin-mod.open .exem-admin-mod-toggle{transform:rotate(180deg)}
  .exem-admin-mod-body{padding:12px 14px;border-top:1px solid var(--border);display:none}
  .exem-admin-mod.open .exem-admin-mod-body{display:block}
  .exem-act-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:8px;display:grid;gap:6px}
  .exem-act-card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .exem-act-card select,.exem-act-card input[type=text],.exem-act-card input[type=url]{font-size:12.5px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);width:100%}
  .exem-act-card select{width:auto}
  .exem-act-card input[type=number]{font-size:12.5px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);width:56px}
  .exem-act-lbl{font-size:11.5px;color:var(--muted);margin:4px 0 2px}
  .exem-act-2col{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .btn-del{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#ef4444;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;margin-left:auto}
  .btn-sm{font-size:12.5px;padding:5px 12px;border:1px dashed var(--border);border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;margin-top:4px}
  .btn-sm:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<div id="errorBar"><span id="errorMsg"></span><span class="x" onclick="clearError()">✕</span></div>

<!-- LOGIN -->
<div id="login">
  <div class="card-login">
    <div class="brand"><div class="dot">CC</div><div><h1>EAS CC</h1></div></div>
    <div class="sub">Avaluació per indicadors · Registre d'evidències</div>
    <label for="u">Usuari</label>
    <input id="u" class="field" autocomplete="username" placeholder="usuari">
    <label for="p">Contrasenya</label>
    <input id="p" class="field" type="password" autocomplete="current-password" placeholder="••••••">
    <button class="btn" id="btnLogin" onclick="formLogin()">Accedir</button>
    <div style="text-align:center;margin-top:12px"><button class="btn-link" onclick="doRequestResetFromLogin()">Has oblidat la contrasenya?</button></div>
    <div id="pingStatus"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="top">
    <div class="brand"><div class="dot">CC</div><h1>EAS CC</h1></div>
    <nav class="nav" id="nav"></nav>
    <div class="userbox">
      <span class="modepill" id="modePill" onclick="toggleMode()"></span>
      <span class="modepill" id="themePill" onclick="toggleTheme()"></span>
      <div class="who"><div class="n" id="uName"></div><div class="r" id="uRole"></div></div>
      <button class="btn sm ghost" id="btnPerfil" style="display:none" onclick="renderPerfil()">Perfil</button>
      <button class="btn sm ghost" onclick="logout()">Sortir</button>
    </div>
  </header>
  <main id="content"></main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* URL del desplegament GAS (Implementar → App web). Substitueix per la teva URL. */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbzzGYKLaUPxHSjWKf9fK56yr3F4LHVn92lORn_0jO0fdZqptd1PIj9kIV7y68dKq7pP/exec';

function call(action, payload){
  return fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify({ action: action, payload: payload || {} })
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}
var state = { user:null, device:'pc', theme:'dark', view:'inici',
  // wizard
  step:1, curs:null, classe:null, module:null, moduleProjects:null, projecte:null, activity:null, data:null,
  indicators:[], curInd:0, students:null, grades:{}, editBlock:null,
  activityParaules:'', _indDescExpanded:false,
  grup:null, hasGrups:false,
  // admin
  adminTab:'usuaris', selectedAlumneId:null, alumnesClasse:'', alumneResumBack:'resum',
  // dashboards (mòdul obligatori)
  iniciClasse:null, iniciModul:null, resumClasse:null, resumModul:null, evModul:null, projModul:null, activModul:null };

var CAPS=['c1','c2','c3','c4','c5','c6','c7'];
var CAP_NOMS={c1:'Organització',c2:'Iniciativa',c3:'Responsabilitat',c4:'Autonomia',c5:'Treball equip',c6:'Rel. interpersonals',c7:'Resolució'};
var CAP_ABBR={c1:'Org',c2:'Ini',c3:'Resp',c4:'Aut',c5:'Eq',c6:'Rel',c7:'Resol'};
var CAP_BG={c1:'#B4A7D6',c2:'#FFE599',c3:'#A4C2F4',c4:'#B6D7A8',c5:'#A2C4C9',c6:'#F9CB9C',c7:'#EA9999'};

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* string segur dins un argument JS entre cometes simples en un atribut HTML (cometes dobles) */
function q(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,"\\'");}
/* JSON segur dins un atribut HTML amb cometes simples */
function j(o){return JSON.stringify(o).replace(/&/g,'&amp;').replace(/'/g,'&#39;');}
function showError(m){$('errorMsg').innerHTML='<code>'+esc(m)+'</code>';$('errorBar').classList.add('show');}
function clearError(){$('errorBar').classList.remove('show');}
function setPing(t){$('pingStatus').textContent=t;}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(function(){e.classList.remove('show');},2600);}
function openModal(h){$('modal').innerHTML=h;$('overlay').classList.add('show');}
function closeModal(){$('overlay').classList.remove('show');$('modal').innerHTML='';}
function btnBusy_(btn,label){if(!btn)return;btn._ot=btn.textContent;btn.disabled=true;btn.textContent=label||'Carregant…';}
function btnFree_(btn){if(!btn)return;btn.disabled=false;btn.textContent=btn._ot||btn.textContent;}
function showNovaActPopup(cb){
  window._novaActCb=cb;
  var items=['Està temporitzada a la programació des de l\'inici del projecte/curs.',
    'Està contextualitzada al projecte/contingut.',
    'Té més d\'un indicador/capacitat clau associada.',
    'Permet descriure accions associades als indicadors avaluats.',
    'Ofereix a l\'alumnat la possibilitat de mostrar les capacitats clau que se li avaluen de forma senzilla.'];
  openModal(
    '<h3 style="margin:0 0 16px;font-size:15px;font-weight:700">L\'activitat que vull introduir a l\'aplicatiu…</h3>'+
    '<ul style="list-style:none;padding:0;margin:0 0 20px;display:flex;flex-direction:column;gap:10px">'+
    items.map(function(t){
      return '<li style="display:flex;align-items:flex-start;gap:10px;font-size:13.5px">'+
        '<input type="checkbox" style="margin-top:2px;flex:none;width:15px;height:15px;cursor:pointer"> <span>'+esc(t)+'</span></li>';
    }).join('')+
    '</ul>'+
    '<div class="actions"><button class="btn" onclick="closeModal();window._novaActCb&&window._novaActCb()">Acceptar</button></div>'
  );
}
function scoreColor(n){ if(n==null) return null; n=Math.round(n); if(n<=2)return '#E25563'; if(n<=5)return '#E0A23C'; if(n<=8)return '#4F8EF7'; return '#3FB27F'; }

/* device + login */
function detectDevice(){var s=window.matchMedia&&window.matchMedia('(max-width: 768px)').matches;var t=('ontouchstart' in window)&&window.innerWidth<900;return (s||t)?'mobile':'pc';}
function resolveDevice(){return detectDevice();}
function applyMode(){document.body.classList.remove('mode-pc','mode-mobile');document.body.classList.add('mode-'+(state.device||'pc'));$('modePill').textContent=(state.device==='mobile'?'📱 Mòbil':'🖥️ PC');}
function toggleMode(){state.device=(state.device==='mobile')?'pc':'mobile';applyMode();
  if($('app').style.display!=='none'&&(state.user.rol==='professor'||state.user.rol==='admin')){ buildNav(); go(state.device==='mobile'?'registrar':(state.view||'inici')); }}
function applyTheme(){document.body.classList.toggle('light',state.theme==='light');var p=$('themePill');if(p)p.textContent=(state.theme==='light'?'☀️ Clar':'🌙 Fosc');}
function toggleTheme(){state.theme=(state.theme==='light')?'dark':'light';try{localStorage.setItem('eascc_theme',state.theme);}catch(e){}applyTheme();}
function initTheme(){try{var t=localStorage.getItem('eascc_theme');if(t)state.theme=t;}catch(e){}applyTheme();}
async function doLogin(username,password){
  var btn=$('btnLogin'); btnBusy_(btn,'Connectant…');
  clearError();setPing('');
  var r; try{r=await call('loginAndInit',{username:username,password:password});}catch(e){btnFree_(btn);setPing('');return showError('Error de connexió: '+(e&&e.message?e.message:e));}
  if(!r||!r.ok){btnFree_(btn);setPing('');return showError(r&&r.error?r.error:'Login fallit.');}
  setPing('');clearError();
  state.user=r.user;
  if(r.initialData){ var d=r.initialData;
    state._courses=d.courses; state._modsByCurs=d.modsByCurs;
    state._allModules=d.allModules; state._allClasses=d.allClasses; state._capabilities=d.capabilities; }
  state._avisos=r.avisos||[];
  state.device=resolveDevice(); enterApp();
}
function formLogin(){doLogin($('u').value.trim(),$('p').value);}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&$('app').style.display!=='flex')formLogin();});
function logout(){state.user=null;$('app').style.display='none';$('login').style.display='flex';setPing('');var fab=$('helpFab');if(fab)fab.style.display='none';}

/* entrada + nav */
function enterApp(){
  var u=state.user;
  $('login').style.display='none';$('app').style.display='flex';
  $('uName').textContent=(u.nom+' '+u.cognom).trim();$('uRole').textContent=u.rol;applyMode();applyTheme();
  var bp=$('btnPerfil'); if(bp) bp.style.display='';
  var fab=$('helpFab'); if(fab) fab.style.display=(u.rol==='alumne')?'none':'flex';
  if(u.mustChangePassword){ renderForceChangePassword(); return; }
  buildNav();
  showAvisosBanner(state._avisos||[]);
  var mobileOnly=(state.device==='mobile');
  var defaultView=(u.rol==='admin')?'usuaris':(u.rol==='alumne')?'alumneresum':(mobileOnly?'registrar':'inici');
  go(defaultView);
}
function showAvisosBanner(avisos){
  var old=$('avisosBanner'); if(old) old.parentNode.removeChild(old);
  if(!avisos||!avisos.length) return;
  var readIds=(state.user&&state.user.avisos_llegits)||[];
  var unseen=avisos.filter(function(a){ return readIds.indexOf(String(a.id))===-1; });
  if(!unseen.length) return;
  var shown=unseen.slice(0,5);
  var items=shown.map(function(a){
    return '<div style="padding:14px 0;border-bottom:1px solid var(--border,#e5e7eb)">'
      +'<div style="font-size:15px;line-height:1.5;color:var(--text,#111)">'+avisFmt(a.text)+'</div>'
      +'</div>';
  }).join('');
  var overlay=document.createElement('div');
  overlay.id='avisosBanner';
  overlay.style.cssText='position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px';
  overlay.innerHTML=
    '<div style="background:var(--surface,#fff);border:1px solid var(--border,#d7dde8);border-radius:12px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.35);padding:24px 24px 16px">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">'
    +'<div style="font-weight:700;font-size:17px;color:var(--text,#111)">📢 Missatge de l\'equip</div>'
    +'</div>'
    +items
    +'<div style="text-align:right;margin-top:16px"><button class="btn" id="avisosBannerOk">Entès</button></div>'
    +'</div>';
  document.body.appendChild(overlay);
  document.getElementById('avisosBannerOk').addEventListener('click',function(){
    var shownIds=shown.map(function(a){return String(a.id);});
    // Actualitza l'estat local immediatament
    if(state.user) state.user.avisos_llegits=(state.user.avisos_llegits||[]).concat(shownIds);
    var b=document.getElementById('avisosBanner'); if(b) b.parentNode.removeChild(b);
    // Desa al Sheets en segon pla (no bloqueja la UI)
    call('markAvisosLlegits',{ids:shownIds, username:state.user&&state.user.username}).catch(function(){});
  });
}
function buildNav(){
  if(state.user&&state.user.rol==='admin'){
    $('nav').innerHTML=[['usuaris',"Gestió d'usuaris"],['actcataleg',"Gestió d'activitats"],['exemples',"Exemples pràctics"]].map(function(n){
      return '<button data-v="'+n[0]+'" onclick="go(\''+n[0]+'\')">'+n[1]+'</button>';
    }).join('');
    return;
  }
  if(state.user&&state.user.rol==='alumne'){
    var navH='<button data-v="alumneresum" onclick="go(\'alumneresum\')">El meu resum</button>';
    if(state.user.historialEnabled) navH+='<button data-v="historial" onclick="go(\'historial\')">Historial</button>';
    $('nav').innerHTML=navH;
    return;
  }
  if(state.device==='mobile'){
    $('nav').innerHTML='<button data-v="registrar" onclick="go(\'registrar\')">Enregistrar</button>';
    return;
  }
  // Professor desktop — amb submenús
  var groups=[
    {label:'Inici', view:'inici'},
    {label:'Evidències', children:[{view:'registrar',label:'Enregistrar'},{view:'evidencies',label:'Historial'}]},
    {label:'Gestió Alumnat', children:[{view:'resum',label:'Resum MP'},{view:'alumnes',label:'Alumnat'}]},
    {label:'Gestió MP', children:[{view:'activitats',label:'Activitats'},{view:'projectes',label:'Projectes'},{view:'exemples',label:'Exemples pràctics'}]}
  ];
  $('nav').innerHTML=groups.map(function(g){
    if(!g.children) return '<button data-v="'+g.view+'" onclick="go(\''+g.view+'\')">'+g.label+'</button>';
    var childViews=g.children.map(function(c){return c.view;}).join(',');
    return '<div class="nav-group" data-views="'+childViews+'">'
      +'<button class="nav-gBtn">'+g.label+'</button>'
      +'<div class="nav-dropdown">'+g.children.map(function(c){
        return '<button data-v="'+c.view+'" onclick="go(\''+c.view+'\')">'+c.label+'</button>';
      }).join('')+'</div>'
      +'</div>';
  }).join('');
}
function go(view){
  state.view=view;
  Array.prototype.forEach.call($('nav').children,function(el){
    if(el.classList&&el.classList.contains('nav-group')){
      var views=(el.getAttribute('data-views')||'').split(',');
      el.classList.toggle('active',views.indexOf(view)>=0);
      Array.prototype.forEach.call(el.querySelectorAll('button[data-v]'),function(b){
        b.classList.toggle('active',b.getAttribute('data-v')===view);
      });
    } else if(el.getAttribute){
      el.classList.toggle('active',el.getAttribute('data-v')===view);
    }
  });
  if(view==='inici') return renderInici();
  if(view==='registrar') return renderRegistrar();
  if(view==='evidencies') return renderEvidencies();
  if(view==='resum') return renderResum();
  if(view==='activitats') return renderActivitats();
  if(view==='projectes') return renderProjectes();
  if(view==='usuaris') return renderUsuaris();
  if(view==='actcataleg') return renderActCataleg();
  if(view==='alumnes') return renderAlumnes();
  if(view==='alumneresum') return renderAlumneResum();
  if(view==='historial') return renderHistorial();
  if(view==='exemples') return renderExemples();
}

/* ---------- selectors compartits (classe + mòdul) ---------- */
async function loadAllClasses(){
  if(state._allClasses) return state._allClasses;
  var rc=await call('getCourses',{user:state.user}); if(!rc.ok){showError(rc.error);return [];}
  var results=await Promise.all(rc.courses.map(function(curs){return call('getClasses',{curs:curs});}));
  var seen={}, classes=[];
  results.forEach(function(r){if(r.ok) r.classes.forEach(function(c){if(!seen[c]){seen[c]=true;classes.push(c);}});});
  state._allClasses=classes.sort();
  return state._allClasses;
}
async function loadModulesForClasse(classe){
  if(!classe) return [];
  if(state._modsByCurs && state._modsByCurs[classe.charAt(0)]) return state._modsByCurs[classe.charAt(0)];
  var r=await call('getModules',{user:state.user,curs:classe.charAt(0)});
  return r.ok?r.modules:[];
}
function selectorsBar(classe, modul, classes, modules, onClasse, onModul){
  return '<div class="panel"><div class="row">'+
    '<label style="margin:0">Classe</label>'+
    '<select class="field inline" onchange="'+onClasse+'(this.value)">'+
      '<option value="">— tria —</option>'+
      classes.map(function(c){return '<option '+(c===classe?'selected':'')+'>'+esc(c)+'</option>';}).join('')+'</select>'+
    '<label style="margin:0 0 0 8px">Mòdul</label>'+
    '<select class="field inline" onchange="'+onModul+'(this.value)">'+
      '<option value="">— tria —</option>'+
      modules.map(function(m){return '<option value="'+esc(m.codi)+'" '+(m.codi===modul?'selected':'')+'>'+esc(m.nom)+'</option>';}).join('')+
    '</select></div></div>';
}

/* selector de mòdul (tots els visibles) */
async function loadAllModules(){
  if(state._allModules) return state._allModules;
  var rc=await call('getCourses',{user:state.user}); if(!rc.ok) return [];
  var results=await Promise.all(rc.courses.map(function(curs){return call('getModules',{user:state.user,curs:curs});}));
  var mods=[], seen={};
  results.forEach(function(r){if(r.ok) r.modules.forEach(function(m){if(!seen[m.codi]){seen[m.codi]=true;mods.push(m);}});});
  state._allModules=mods;
  return mods;
}

/* ====================== INICI ====================== */
async function renderInici(){
  $('content').innerHTML='<h2 class="page-title">Inici</h2><p class="page-sub">Com va el grup en aquest mòdul segons les evidències registrades.</p><div id="iniciTop"></div><div id="iniciBody"></div>';
  var classes=await loadAllClasses();
  if(!state.iniciClasse && classes.length) state.iniciClasse=classes[0];
  var modules=await loadModulesForClasse(state.iniciClasse);
  if(!state.iniciModul && modules.length) state.iniciModul=modules[0].codi;
  $('iniciTop').innerHTML=selectorsBar(state.iniciClasse,state.iniciModul,classes,modules,'iniciSetClasse','iniciSetModul');
  if(!state.iniciClasse||!state.iniciModul){ $('iniciBody').innerHTML='<div class="empty">Tria classe i mòdul.</div>'; return; }
  $('iniciBody').innerHTML='<div class="empty">Carregant…</div>';
  var r=await call('getInici',{user:state.user,classe:state.iniciClasse,moduleCodi:state.iniciModul});
  if(!r.ok) return showError(r.error);
  var d=r.data; var tot=d.dist.r+d.dist.a+d.dist.b+d.dist.v+d.dist.na;
  var seg=function(n,col){return tot?'<i style="width:'+(n/tot*100)+'%;background:'+col+'"></i>':'';};
  $('iniciBody').innerHTML=
    '<div class="cards" style="margin-bottom:16px">'+
      stat(d.nAlumnes,'Alumnes')+stat(d.nEvidencies,'Evidències')+stat(d.nValoracions,'Valoracions')+
      stat(d.nAlumnesAval+' / '+d.nAlumnes,'Alumnes avaluats')+'</div>'+
    '<div class="two-col">'+
      '<div class="panel"><h3>Distribució de valoracions</h3>'+
        (tot?('<div class="distbar">'+seg(d.dist.r,'#E25563')+seg(d.dist.a,'#E0A23C')+seg(d.dist.b,'#4F8EF7')+seg(d.dist.v,'#3FB27F')+seg(d.dist.na,'#6B7280')+'</div>'+
        '<div class="legend"><span><i style="background:#E25563"></i>No assolit ('+d.dist.r+')</span><span><i style="background:#E0A23C"></i>En procés ('+d.dist.a+')</span><span><i style="background:#4F8EF7"></i>Assolit ('+d.dist.b+')</span><span><i style="background:#3FB27F"></i>Excel·lència ('+d.dist.v+')</span><span><i style="background:#6B7280"></i>NA ('+d.dist.na+')</span></div>')
        :'<div class="empty">Encara no hi ha evidències.</div>')+'</div>'+
      '<div class="panel"><h3>Perfil mitjà del grup</h3><div style="display:grid;place-items:center"><canvas id="iniciRadar" width="320" height="320"></canvas></div></div>'+
    '</div>';
  drawRadar($('iniciRadar'), CAPS.map(function(c){return d.classMean[c]||0;}), '#4f8ef7');
}
function stat(k,l){return '<div class="card stat"><div class="k">'+k+'</div><div class="l">'+l+'</div></div>';}
function iniciSetClasse(v){state.iniciClasse=v;state.iniciModul=null;renderInici();}
function iniciSetModul(v){state.iniciModul=v;renderInici();}

/* ====================== RESUM CLASSE ====================== */
async function renderResum(){
  $('content').innerHTML='<h2 class="page-title">Resum MP</h2><p class="page-sub">Nivell per competència del mòdul (només colors). Passa el ratolí per veure el valor.</p><div id="resumTop"></div><div id="resumBody"></div>';
  var classes=await loadAllClasses();
  if(!state.resumClasse && classes.length) state.resumClasse=classes[0];
  var modules=await loadModulesForClasse(state.resumClasse);
  if(!state.resumModul && modules.length) state.resumModul=modules[0].codi;
  $('resumTop').innerHTML=selectorsBar(state.resumClasse,state.resumModul,classes,modules,'resumSetClasse','resumSetModul');
  if(!state.resumClasse||!state.resumModul){ $('resumBody').innerHTML='<div class="empty">Tria classe i mòdul.</div>'; return; }
  $('resumBody').innerHTML='<div class="empty">Carregant…</div>';
  var r=await call('getModuleResum',{moduleCodi:state.resumModul,classe:state.resumClasse});
  if(!r.ok) return showError(r.error);
  var d=r.data;

      }).join('')+'<td></td></tr>';

  function summaryRow(label, g, borderStyle, bgStyle){
    var nota=g&&g.nota!=null?g.nota:null;

  var tbody=

    summaryRow('Nota global cicle', d.globalCicle, 'border-top:3px solid var(--accent)', 'background:var(--accent-soft)');

  var backBtn=isAlumne?'':'<button class="btn sm ghost" onclick="go(\''+backView+'\')">← '+backLabel+'</button>';
  $('content').innerHTML=
    '<div class="row" style="margin-bottom:18px;gap:12px;align-items:baseline">'+backBtn+

      '<div class="panel"><h3>Perfil global de CC</h3><div style="display:grid;place-items:center"><canvas id="alumneRadar" width="300" height="300"></canvas></div></div>'+
      '<div class="panel"><h3>Llegenda</h3>'+
        '<div class="legend" style="flex-direction:column;gap:8px">'+
          '<span><i style="background:#3fb27f"></i>Excel·lència</span>'+
          '<span><i style="background:#4f8ef7"></i>Assolit</span>'+
          '<span><i style="background:#e0a23c"></i>En procés</span>'+

    var ptColors=CAPS.map(function(cap){

}

async function exportAlumnesPDF(anon){
  var classe=state.alumnesClasse; if(!classe) return;
  toast(anon?'Generant PDF anonimitzat… pot trigar uns segons.':'Generant PDF… pot trigar uns segons.');
  var r=await call('getClassGlobalResum',{classe:classe});
  if(!r||!r.ok) return showError(r&&r.error?r.error:'Error generant el resum.');
  var d=r.data;
  if(!d.students||!d.students.length) return showError('Cap alumne amb dades per exportar.');
  if(anon) d=Object.assign({},d,{students:d.students.map(function(s){return Object.assign({},s,{cognom:''});})});
  var e2=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var RCAPS=['c1','c3','c5','c4','c2','c6','c7'];
  var RNAMES={c1:'Organització',c3:'Responsabilitat',c5:'Treball en equip',c4:'Autonomia',c2:'Iniciativa',c6:'Relacions personals',c7:'Resolució de problemes'};
  var RLBL={c1:'Organit.',c3:'Respons.',c5:'Treball eq.',c4:'Autonomia',c2:'Iniciativa',c6:'Relacions',c7:'Resolució'};
  function sColor(n){if(n==null)return null;n=Math.round(n);if(n<=2)return '#E25563';if(n<=5)return '#E0A23C';if(n<=8)return '#4F8EF7';return '#3FB27F';}
  function mkSvg(cells){
    var color='#7aa9ff',N=7,vb=260,cx=130,cy=130,R=82,LR=110;
    function pt(i,r){var a=-Math.PI/2+i*2*Math.PI/N;return {x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r};}
    var p=[];
    [0.25,0.5,0.75,1].forEach(function(f){var g=[];for(var i=0;i<N;i++){var pp=pt(i,R*f);g.push(pp.x.toFixed(1)+','+pp.y.toFixed(1));}p.push('<polygon points="'+g.join(' ')+'" fill="none" stroke="#e0e0e0" stroke-width="0.8"/>');});
    for(var i=0;i<N;i++){var pe=pt(i,R);p.push('<line x1="'+cx+'" y1="'+cy+'" x2="'+pe.x.toFixed(1)+'" y2="'+pe.y.toFixed(1)+'" stroke="#e0e0e0" stroke-width="0.8"/>');}
    var vals=RCAPS.map(function(cap){return cells[cap]||0;});
    var dp=vals.map(function(v,i){var pp=pt(i,R*Math.min(v,10)/10);return pp.x.toFixed(1)+','+pp.y.toFixed(1);});
    p.push('<polygon points="'+dp.join(' ')+'" fill="'+color+'33" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>');
    vals.forEach(function(v,i){var pp=pt(i,R*Math.min(v,10)/10);p.push('<circle cx="'+pp.x.toFixed(1)+'" cy="'+pp.y.toFixed(1)+'" r="3.5" fill="'+color+'"/>');});
    RCAPS.forEach(function(cap,i){var pl=pt(i,LR);p.push('<text x="'+pl.x.toFixed(1)+'" y="'+pl.y.toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="10" font-family="system-ui,sans-serif" fill="#444">'+RLBL[cap]+'</text>');});
    return '<svg width="200" height="200" viewBox="0 0 '+vb+' '+vb+'" xmlns="http://www.w3.org/2000/svg">'+p.join('')+'</svg>';
  }
  var today=new Date(); var dateStr=today.getDate()+'/'+(today.getMonth()+1)+'/'+today.getFullYear();
  function pageHTML(s){
    var svg=mkSvg(s.cells);
    var tableRows=RCAPS.map(function(cap){
      var v=s.cells[cap]; var col=sColor(v);
      var dot='background:'+(col||'#e5e7eb');
      var scoreHtml=v!=null?('<span style="color:'+(col||'#9ca3af')+';font-weight:700">'+v+'/10</span>'):'<span style="color:#ccc">—</span>';
      return '<tr><td><span class="dot" style="'+dot+'"></span>'+e2(RNAMES[cap])+'</td><td style="text-align:right">'+scoreHtml+'</td></tr>';
    }).join('');
    var notaGlobal=s.nota!=null?'<div class="nota-global">Nota global cicle: <strong>'+Number(s.nota).toFixed(1)+'</strong></div>':'';
    return '<div class="page">'+
      '<div class="top-bar"><div class="cc-badge">CC</div>'+
      '<div><div style="font-size:20px;font-weight:700">Resum de les CC</div>'+
      '<div style="font-size:13px;color:#6b7280;margin-top:3px">Classe '+e2(classe)+'</div></div></div>'+
      '<div style="font-size:18px;font-weight:700;margin-bottom:18px">'+(s.cognom?e2(s.cognom)+', ':'')+e2(s.nom)+'</div>'+
      '<div class="body-grid">'+
        '<div>'+svg+'</div>'+
        '<div>'+
          '<table class="cc-t"><tbody>'+tableRows+'</tbody></table>'+
          notaGlobal+
          '<div class="legend">'+
            '<div class="lr"><span class="dot" style="background:#3fb27f"></span>Excel·lent (9-10)</div>'+
            '<div class="lr"><span class="dot" style="background:#4f8ef7"></span>Notable (6-8)</div>'+
            '<div class="lr"><span class="dot" style="background:#e0a23c"></span>Aprovat (3-5)</div>'+
            '<div class="lr"><span class="dot" style="background:#e25563"></span>Insuficient (1-2)</div>'+
            '<div class="lr"><span class="dot" style="background:#e5e7eb"></span>Sense dades</div>'+
          '</div>'+
          '<div class="note">Resum generat el '+dateStr+'. Les valoracions es calculen a partir de les evidències registrades pels professors.</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }
  var pages=d.students.map(pageHTML).join('');
  var css='@page{size:A4;margin:18mm 20mm 15mm}*{box-sizing:border-box;margin:0;padding:0}'+
    'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#111;background:#fff}'+
    '.page{page-break-after:always;padding-bottom:8mm}.page:last-child{page-break-after:auto}'+
    '.top-bar{display:flex;align-items:center;gap:14px;border-bottom:3px solid #4F8EF7;padding-bottom:12px;margin-bottom:22px}'+
    '.cc-badge{background:#4F8EF7;color:#fff;font-weight:800;font-size:18px;width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}'+
    '.body-grid{display:grid;grid-template-columns:210px 1fr;gap:28px;align-items:start}'+
    'table.cc-t{width:100%;border-collapse:collapse}table.cc-t tr{border-bottom:1px solid #f3f4f6}table.cc-t td{padding:7px 8px;font-size:13px;vertical-align:middle}'+
    '.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px;vertical-align:middle;flex-shrink:0}'+
    '.legend{margin-top:16px;display:flex;flex-direction:column;gap:5px}'+
    '.lr{display:flex;align-items:center;gap:6px;font-size:11px;color:#6b7280}'+
    '.nota-global{margin-top:12px;font-size:14px;color:#111;padding:8px 10px;background:#f0f4ff;border-radius:6px;border-left:3px solid #4f8ef7}'+
    '.note{margin-top:16px;font-size:10.5px;color:#aaa;line-height:1.5}';
  var html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>Resum CC - Classe '+e2(classe)+'</title><style>'+css+'</style></head><body>'+pages+'</body></html>';
  var w=window.open('','_blank');
  if(!w) return showError('El navegador ha bloquejat la finestra emergent. Permet les finestres emergents per a aquest lloc i torna a intentar-ho.');
  w.document.write(html); w.document.close(); w.focus();
  setTimeout(function(){w.print();},400);
}

var STEPS=['Curs','Classe','Mòdul','Projecte','Activitat','Avaluació'];

  $('crumbs').innerHTML=STEPS.map(function(s,i){var n=i+1;var muted=(n===4&&noProj);var cls='crumb'+(n===state.step?' on':'')+(n<state.step?' done':'')+(muted?' muted':'');return '<span class="'+cls+'" onclick="goStep('+n+')">'+esc(sel[i])+'</span>';}).join('');

async function createActivity(btn){

  if(!r.ok){ btnFree_(btn); return showError(r.error); }

function pickActivitat(a){state.activity=a;state.step=6;if(!state.editBlock)state.grades={};state.curInd=0;state.activityParaules='';state._indDescExpanded=false;renderStep();}
async function stepAvaluacio(){
  loadingStep('Carregant indicadors i alumnes…');
  var res=await Promise.all([
    call('getActivityIndicators',{activitat:state.activity,moduleCodi:state.module.codi}),
    call('getStudents',{classe:state.classe,moduleCodi:state.module.codi,grup:state.grup})
  ]);
  var ri=res[0], rs=res[1];
  if(!ri.ok) return showError(ri.error); if(!rs.ok) return showError(rs.error);
  state.indicators=ri.indicators; state.activityParaules=ri.paraules||''; state.students=rs.data;
  state.indicators.forEach(function(ind){ if(!state.grades[ind.codi]) state.grades[ind.codi]={}; });
  paintAvaluacio();

function NB(){return [{value:'NA',color:'#6B7280',label:'No avaluable'},{value:1,color:'#E25563',label:'No assolit'},{value:4,color:'#E0A23C',label:'En procés'},{value:7,color:'#4F8EF7',label:'Assolit'},{value:10,color:'#3FB27F',label:'Excel·lència'}];}
function evalStatus(){
  var all=(state.students.regular||[]).concat(state.students.pendents||[]);
  var need=state.indicators.length*all.length, done=0, pending=[];
  state.indicators.forEach(function(x){ var d=Object.keys(state.grades[x.codi]||{}).filter(function(k){return state.grades[x.codi][k]!=null;}).length; done+=d; if(d<all.length) pending.push(x.codi); });
  return { all:all, need:need, done:done, pending:pending, complete:(need>0 && done===need) };
}
function paintAvaluacio(){
  if(!state.indicators.length){$('step').innerHTML='<div class="empty">Aquesta activitat no té indicadors assignats (revisa «Codi Indicador»).</div>';return;}
  var ind=state.indicators[state.curInd];
  var stt=evalStatus(); var all=stt.all;
  var tabs=state.indicators.map(function(x,i){
    var d=Object.keys(state.grades[x.codi]||{}).filter(function(k){return state.grades[x.codi][k]!=null;}).length;
    var ok=(d>=all.length && all.length>0);
    return '<div class="indtab'+(i===state.curInd?' on':'')+(ok?' ok':'')+'" onclick="state.curInd='+i+';paintAvaluacio()"><span class="swatch" style="background:'+esc(x.colorInd)+'"></span><span class="code">'+esc(x.codi)+'</span><span class="prog">'+(ok?'✓':d+'/'+all.length)+'</span></div>';
  }).join('');
  var btns=function(stId){return '<div class="gbtns">'+NB().map(function(b){var on=state.grades[ind.codi][stId]===b.value;var na=(b.value==='NA')?' na':'';var bg=(b.value==='NA')?'':('background:'+b.color);return '<button class="gbtn'+na+(on?' on':'')+'" style="'+bg+'" title="'+esc(b.label)+'" onclick="setGrade(\''+stId+'\',\''+b.value+'\')"></button>';}).join('')+'</div>';};
  var lines=function(arr,p){return arr.map(function(s){return '<div class="student-line"><span class="nm">'+esc(s.cognom)+', '+esc(s.nom)+(p?'<span class="ptag">pendent · '+esc(s.classe)+'</span>':'')+'</span>'+btns(s.id)+'</div>';}).join('');};
  var linesOff=function(arr,tag){return arr.map(function(s){return '<div class="student-line off"><span class="nm">'+esc(s.cognom)+', '+esc(s.nom)+'<span class="ntag">'+(tag||'no matriculat')+'</span></span></div>';}).join('');};
  var noMat=state.students.noMatriculats||[];
  var altreGrup=state.students.altreGrup||[];
  var done=Object.keys(state.grades[ind.codi]).filter(function(k){return state.grades[ind.codi][k]!=null;}).length;
  var projTxt=state.projecte?(' · P'+esc(state.projecte.num)):'';
  var saveBtn = stt.complete
    ? '<button class="btn sm" onclick="saveRegistre(this)">Desar registre</button>'
    : '<button class="btn sm" disabled title="Falten valoracions">Falten '+(stt.need-stt.done)+' valoracions</button>';
  var indDesc=(function(){var ex=state._indDescExpanded; var pw=ind.paraules||'';
    if(ex){return '<div class="ind-desc"><div class="cap" style="color:'+esc(ind.colorInd)+'">'+esc(ind.capacitat)+' · '+esc(ind.codi)+'</div>'+esc(ind.text)+'<div style="margin-top:8px"><button class="btn-link" onclick="state._indDescExpanded=false;paintAvaluacio()">← Mostra menys</button></div></div>';}
    return '<div class="ind-desc">'+(pw?'<div class="kws"><span style="color:'+esc(ind.colorInd)+';font-weight:600">'+esc(ind.codi.charAt(0).toUpperCase()+ind.codi.slice(1))+'</span> – '+esc(pw)+'</div>':'<div class="cap" style="color:'+esc(ind.colorInd)+'">'+esc(ind.codi)+'</div>')+'<button class="btn-link" onclick="state._indDescExpanded=true;paintAvaluacio()">Mostra més →</button></div>';
  })();
  var _panel=document.querySelector('.panel.scrollable'); var _scroll=_panel?_panel.scrollTop:0;
  $('step').innerHTML=
    '<h2 class="step-title">'+(state.editBlock?'Editar registre · ':'Avaluació · ')+esc(state.activity)+'</h2>'+
    '<p class="step-sub">Grup '+esc(state.classe)+' · «'+esc(state.module.nom)+'»'+projTxt+' · '+esc(state.data)+'</p>'+
    '<div class="indtabs">'+tabs+(state.indicators.length>1?'<button class="btn sm ghost" style="margin-left:auto;flex-shrink:0;white-space:nowrap" onclick="copyGradesToRest()" title="Copia les notes d\'aquest indicador als indicadors sense cap nota">⧉ Copia a la resta</button>':'')+'</div>'+
    indDesc+
    '<div class="panel scrollable"><div class="allrow"><span class="muted" style="font-size:13px">Aplica a tots →</span><div class="gbtns">'+
      NB().map(function(b){var na=(b.value==='NA')?' na':'';var bg=(b.value==='NA')?'':('background:'+b.color);return '<button class="gbtn'+na+'" style="'+bg+'" title="'+esc(b.label)+'" onclick="setAll(\''+b.value+'\')"></button>';}).join('')+
      '</div><div class="spacer"></div><span class="counter">'+done+' / '+all.length+'</span></div>'+
      lines(state.students.regular||[],false)+
      ((state.students.pendents&&state.students.pendents.length)?('<div class="subhead">Pendents (altres grups)</div>'+lines(state.students.pendents,true)):'')+
      ((noMat.length)?('<div class="subhead">No matriculats / aprovats (no avaluables)</div>'+linesOff(noMat)):'')+
      ((altreGrup.length)?('<div class="subhead">Altre grup (no avaluables)</div>'+linesOff(altreGrup,'altre grup')):'')+'</div>'+
    '<div class="legend">'+NB().map(function(b){var sw=(b.value==='NA')?'background:repeating-linear-gradient(45deg,var(--stripe-a),var(--stripe-a) 4px,var(--stripe-b) 4px,var(--stripe-b) 8px)':'background:'+b.color;return '<span><i style="'+sw+'"></i>'+esc(b.label)+'</span>';}).join('')+'</div>'+
    (stt.complete?'':'<div class="muted" style="font-size:12.5px;margin-top:10px">Has d\'avaluar tots els indicadors per a tots els alumnes abans de desar. Pendents: '+stt.pending.join(', ')+'</div>')+
    '<div class="row" style="margin-top:18px"><div class="spacer"></div><button class="btn sm ghost" onclick="go(\'registrar\')">Cancel·lar</button>'+saveBtn+'</div>';
  var _newPanel=document.querySelector('.panel.scrollable'); if(_newPanel&&_scroll) setTimeout(function(){_newPanel.scrollTop=_scroll;},0);
}
function copyGradesToRest(){
  var src=state.indicators[state.curInd]; var srcG=state.grades[src.codi]||{};
  var copied=0;
  state.indicators.forEach(function(ind,i){
    if(i===state.curInd) return;
    var empty=Object.keys(state.grades[ind.codi]||{}).filter(function(k){return state.grades[ind.codi][k]!=null;}).length===0;
    if(empty){state.grades[ind.codi]=Object.assign({},srcG);copied++;}
  });
  toast(copied?('Notes copiades a '+copied+' indicador'+(copied>1?'s':'')+'.'):'Cap indicador buit per copiar.');
  paintAvaluacio();
}
function setGrade(stId,value){var ind=state.indicators[state.curInd];value=(value==='NA')?'NA':Number(value);state.grades[ind.codi][stId]=value;paintAvaluacio();}
function setAll(value){var ind=state.indicators[state.curInd];value=(value==='NA')?'NA':Number(value);var all=(state.students.regular||[]).concat(state.students.pendents||[]);all.forEach(function(s){state.grades[ind.codi][s.id]=value;});paintAvaluacio();}
async function saveRegistre(btn){
  if(btn&&btn.disabled) return;
  var stt=evalStatus();
  if(!stt.complete){ return showError('Has d\'avaluar tots els indicadors per a tots els alumnes abans de desar (falten '+(stt.need-stt.done)+').'); }
  btnBusy_(btn,'Desant…');
  var pl={ curs:state.curs, classe:state.classe, moduleCodi:state.module.codi,
    projecteNum:state.projecte?state.projecte.num:'', projecteNom:state.projecte?state.projecte.nom:'',
    activitat:state.activity, data:state.data, grades:state.grades, createdBy:state.user.username,
    grup:state.grup||null };
  if(state.editBlock) pl.blockCol=state.editBlock.startCol;
  var r=await call('saveRegistre', pl);
  if(!r.ok){ btnFree_(btn); return showError(r.error); }
  toast(r.result.missatge||'Desat.'); state.editBlock=null; go('evidencies');
}

function avisFmt(t){
  return String(t||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/_(.*?)_/g,'<em>$1</em>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs,'<ul style="margin:4px 0 4px 18px;padding:0">$1</ul>')
    .replace(/\n/g,'<br>');
}
function avisInsertFmt(prefix,suffix){
  var ta=$('avisText'); if(!ta) return;
  var s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;
  var sel=v.substring(s,e)||'text';
  ta.value=v.substring(0,s)+prefix+sel+suffix+v.substring(e);
  ta.focus(); ta.selectionStart=s+prefix.length; ta.selectionEnd=s+prefix.length+sel.length;
}

async function doSendAvis(btn){
  if(btn&&btn.disabled) return;
  var text=($('avisText')||{}).value||'';
  if(!text.trim()) return showError('Escriu un missatge.');
  // Detecta mode actiu
  var mode='rol';
  if($('avisMode_classe')&&!$('avisMode_classe').classList.contains('ghost')) mode='classe';
  else if($('avisMode_individual')&&!$('avisMode_individual').classList.contains('ghost')) mode='individual';
  var payload={text:text.trim(), mode:mode, autor:(state.user&&(state.user.nom+' '+state.user.cognom).trim())||'admin', rols:[], classes:[], destinataris:[]};
  if(mode==='rol'){
    if($('avisProf')&&$('avisProf').checked) payload.rols.push('professor');
    if($('avisAlum')&&$('avisAlum').checked) payload.rols.push('alumne');
    if(!payload.rols.length) return showError('Selecciona almenys un rol.');
  } else if(mode==='classe'){
    document.querySelectorAll('.avisClasse:checked').forEach(function(cb){ payload.classes.push(cb.value); });
    if(!payload.classes.length) return showError('Selecciona almenys una classe.');
  } else {
    document.querySelectorAll('.avisUser:checked').forEach(function(cb){ payload.destinataris.push(cb.value); });
    if(!payload.destinataris.length) return showError('Selecciona almenys un destinatari.');
  }
  btnBusy_(btn,'Enviant…');
  var r=await call('saveAvis',payload);
  btnFree_(btn);
  if(!r||!r.ok) return showError(r&&r.error?r.error:'Error enviant el missatge.');
  toast('Missatge desat. Apareixerà als usuaris quan entrin.');
  $('avisText').value='';
  loadAvisHistorial();
}

var _historialData=null;
var _historialFilters={modul:'',cc:''};
async function renderHistorial(){
  $('content').innerHTML=
    '<h2 class="page-title">Historial de qualificacions</h2>'+
    '<div id="histFilters" class="row" style="gap:8px;margin-bottom:14px;flex-wrap:wrap"></div>'+
    '<div id="histBody"><div class="empty">Carregant…</div></div>';
  var r=await call('getAlumneHistorial',{userId:state.user.id});
  if(!r||!r.ok) return showError(r&&r.error?r.error:'Error carregant historial.');
  _historialData=r.data;
  paintHistorial();
}
function paintHistorial(){
  var data=_historialData;
  if(!data||!data.registres||!data.registres.length){
    $('histBody').innerHTML='<div class="empty">Encara no hi ha activitats qualificades.</div>';
    $('histFilters').innerHTML='';
    return;
  }
  var registres=data.registres;
  // Build filter options
  var moduls={};
  registres.forEach(function(r){ moduls[r.moduleCodi]=r.moduleNom; });
  var modOpts='<option value="">Tots els mòduls</option>'+Object.keys(moduls).map(function(k){ return '<option value="'+esc(k)+'"'+(k===_historialFilters.modul?' selected':'')+'>'+esc(moduls[k]||k)+'</option>'; }).join('');
  var ccOpts='<option value="">Totes les CC</option>'+CAPS.map(function(c){ return '<option value="'+esc(c)+'"'+(c===_historialFilters.cc?' selected':'')+'>'+esc(CAP_ABBR[c])+'</option>'; }).join('');
  $('histFilters').innerHTML=
    '<select class="field" style="min-width:160px" onchange="setHistFilter(\'modul\',this.value)">'+modOpts+'</select>'+
    '<select class="field" style="min-width:120px" onchange="setHistFilter(\'cc\',this.value)">'+ccOpts+'</select>';
  // Apply filters
  var filtered=registres.filter(function(r){
    if(_historialFilters.modul && r.moduleCodi!==_historialFilters.modul) return false;
    if(_historialFilters.cc){
      var v=r.ccMeans[_historialFilters.cc];
      if(v===null||v===undefined) return false;
    }
    return true;
  });
  if(!filtered.length){ $('histBody').innerHTML='<div class="empty">Cap resultat per als filtres seleccionats.</div>'; return; }
  // Table header: Activitat, Data, Mòdul, c1..c7
  var thCC=CAPS.map(function(c){
    return '<th style="background:'+CAP_BG[c]+';color:#333;font-size:11px;text-align:center;padding:4px 6px" title="'+esc(CAP_NOMS[c])+'">'+esc(CAP_ABBR[c])+'</th>';
  }).join('');
  var rows=filtered.map(function(reg,idx){
    var actKey='hist_'+idx;
    var ccCells=CAPS.map(function(c){
      var v=reg.ccMeans[c];
      if(v===null||v===undefined) return '<td style="text-align:center;color:var(--muted)">—</td>';
      return '<td style="text-align:center"><span style="display:inline-block;width:20px;height:20px;border-radius:4px;background:#'+gradeHex_(v)+'"></span></td>';
    }).join('');
    var dataStr=reg.data?String(reg.data).substring(0,10):'—';
    var tagHtml=((reg.hashtags||[]).length)?'<div style="margin-top:3px;display:flex;flex-wrap:wrap;gap:3px">'+
      (reg.hashtags||[]).map(function(t){return '<span style="font-size:10px;color:var(--accent);font-weight:500">'+esc(t)+'</span>';}).join('')+
      '</div>':'';
    return '<tr class="hist-row" onclick="toggleHistRow(\''+esc(actKey)+'\')" style="cursor:pointer">'+
      '<td style="font-weight:600">'+esc(reg.activitat||'—')+tagHtml+'</td>'+
      '<td style="white-space:nowrap;font-size:12px;color:var(--muted)">'+esc(dataStr)+'</td>'+
      '<td style="font-size:12px">'+esc(reg.moduleNom||reg.moduleCodi)+'</td>'+
      ccCells+
    '</tr>'+
    '<tr id="'+actKey+'_detail" style="display:none"><td colspan="'+(3+CAPS.length)+'" style="padding:0">'+
      buildHistDetail_(reg)+
    '</td></tr>';
  }).join('');
  $('histBody').innerHTML=
    '<div class="panel" style="padding:0;overflow:auto">'+
    '<table style="width:100%"><thead><tr>'+
      '<th>Activitat</th><th>Data</th><th>Mòdul</th>'+thCC+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function gradeHex_(n){
  if(n===null||n===undefined||n==='NA') return 'D9D9D9';
  var v=Number(n);
  if(isNaN(v)) return 'D9D9D9';
  if(v<=2) return 'E25563';
  if(v<=5) return 'E0A23C';
  if(v<=8) return '4F8EF7';
  return '3FB27F';
}
function normHashtag_(s){
  return String(s||'').trim().split(/[\s,]+/).filter(Boolean).map(function(w){
    return w.charAt(0)==='#'?w:'#'+w;
  }).join(' ');
}
function buildHistDetail_(reg){
  if(!reg.inds||!reg.inds.length) return '<div class="empty" style="padding:12px">Sense indicadors.</div>';
  var byCap={};
  reg.inds.forEach(function(ind){
    if(!byCap[ind.cap]) byCap[ind.cap]=[];
    byCap[ind.cap].push(ind);
  });
  var sections=CAPS.filter(function(c){ return byCap[c]&&byCap[c].length; }).map(function(c){
    var indsHtml=byCap[c].map(function(ind){
      var hex=gradeHex_(ind.grade);
      var gradeLabel=(ind.grade==='NA')?'NA':(ind.grade!==null&&ind.grade!==undefined?String(ind.grade):'—');
      var tagInline=ind.paraules?'<span style="font-size:10px;color:var(--accent);font-weight:500;margin-left:4px">'+esc(normHashtag_(ind.paraules))+'</span>':'';
      return '<div style="display:flex;align-items:flex-start;gap:8px;padding:4px 0">'+
        '<span style="display:inline-block;width:16px;height:16px;border-radius:3px;background:#'+hex+';flex-shrink:0;margin-top:3px"></span>'+
        '<span style="font-size:12px;color:var(--text);line-height:1.4"><b class="mono">'+esc(ind.codi)+'</b> '+esc(ind.text)+tagInline+'</span>'+
      '</div>';
    }).join('');
    return '<div style="margin-bottom:8px">'+
      '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#333;background:'+CAP_BG[c]+';padding:3px 8px;border-radius:4px;display:inline-block;margin-bottom:4px">'+esc(CAP_ABBR[c])+' · '+esc(CAP_NOMS[c])+'</div>'+
      indsHtml+
    '</div>';
  }).join('');
  return '<div style="padding:12px 16px;background:var(--surface2,var(--panel));">'+sections+'</div>';
}
function toggleHistRow(key){
  var el=$(key+'_detail');
  if(!el) return;
  el.style.display=(el.style.display==='none')?'table-row':'none';
}

    var modActs=acts.filter(function(a){return a.mod===m.id;}).sort(function(a,b){return a.pla<b.pla?-1:a.pla>b.pla?1:a.num-b.num;});
    html+='<div class="exem-admin-mod" id="admmod_'+m.id+'">'
      +'<div class="exem-admin-mod-h" onclick="toggleAdmMod(\''+m.id+'\')">'
      +'<input type="checkbox" id="mod_'+m.id+'" '+(modOn?'checked':'')+' style="width:16px;height:16px;accent-color:var(--accent)" onclick="event.stopPropagation()">'
      +'<span style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent)">'+esc(m.codi)+'</span>'
      +'<span style="font-size:14px;font-weight:600">'+esc(m.nom)+'</span>'
      +'<span class="ex-kind '+(m.tipus==='mg'?'mg':'mp')+'">'+(m.curs===1?'1r':'2n')+' curs</span>'
      +'<span class="exem-admin-mod-toggle">▼</span></div>'
      +'<div class="exem-admin-mod-body">'
      +'<div id="acts_'+m.id+'">'
      +modActs.map(function(a){ return actCardHtml(m.id,a); }).join('')
      +'</div>'
      +'<button class="btn-sm" onclick="addExemAct(\''+m.id+'\')">+ Afegir activitat</button>'
      +'</div>'
      +'</div>';
  });
  html+='<div style="margin-top:24px;display:flex;gap:10px"><button class="btn" onclick="saveExemplesAdmin()">Desar tots els canvis</button></div></div>';
  $('content').innerHTML=html;
}
function actCardHtml(modId,a){
  return '<div class="exem-act-card" data-mod="'+modId+'">'
    +'<div class="exem-act-card-h">'
    +'<select data-f="pla" style="width:60px"><option '+(a.pla==='A'?'selected':'')+'>A</option><option '+(a.pla==='B'?'selected':'')+'>B</option></select>'
    +'<input type="number" min="1" max="9" data-f="num" value="'+(a.num||'')+'" placeholder="#">'
    +'<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer;margin-left:4px">'
    +'<input type="checkbox" data-f="actiu" '+(a.actiu!==false?'checked':'')+' style="accent-color:var(--accent)"> Actiu</label>'
    +'<button class="btn-del" onclick="this.closest(\'.exem-act-card\').remove()">Elimina</button>'
    +'</div>'
    +'<div class="exem-act-lbl">Títol</div>'
    +'<input type="text" data-f="titol" placeholder="Títol de l\'activitat" value="'+esc(a.titol||'')+'">'
    +'<div class="exem-act-lbl">Subtítol</div>'
    +'<input type="text" data-f="sub" placeholder="Subtítol (opcional)" value="'+esc(a.sub||'')+'">'
    +'<div class="exem-act-lbl">Hashtags</div>'
    +'<input type="text" data-f="tags" placeholder="#comunicació,#equip" value="'+esc(a.tags||'')+'">'
    +'<div class="exem-act-2col">'
    +'<div><div class="exem-act-lbl">URL presentació</div>'
    +'<input type="url" data-f="url" placeholder="https://..." value="'+esc(a.url||'')+'"></div>'
    +'<div><div class="exem-act-lbl">URL PPT descàrrega</div>'
    +'<input type="url" data-f="ppt" placeholder="https://..." value="'+esc(a.ppt||'')+'"></div>'
    +'</div></div>';
}
function addExemAct(modId){
  var container=$('acts_'+modId); if(!container) return;
  container.insertAdjacentHTML('beforeend',actCardHtml(modId,{pla:'A',num:'',titol:'',sub:'',tags:'',url:'',ppt:'',actiu:true}));
}
async function saveExemplesAdmin(){
  if(!window._adminMods) return saveExemplesAdminOld();
  var mods={};
  EX_MODS.forEach(function(m){ var el=$('mod_'+m.id); mods[m.id]=!el||el.checked; });
  var acts=[];
  document.querySelectorAll('.exem-act-card').forEach(function(card){
    var modId=card.dataset.mod;
    var pla=(card.querySelector('[data-f="pla"]')||{}).value||'A';
    var num=parseInt((card.querySelector('[data-f="num"]')||{}).value)||0;
    var titol=((card.querySelector('[data-f="titol"]')||{}).value||'').trim();
    var sub=((card.querySelector('[data-f="sub"]')||{}).value||'').trim();
    var tags=((card.querySelector('[data-f="tags"]')||{}).value||'').trim();
    var url=((card.querySelector('[data-f="url"]')||{}).value||'').trim();
    var ppt=((card.querySelector('[data-f="ppt"]')||{}).value||'').trim();
    var actiu=(card.querySelector('[data-f="actiu"]')||{}).checked!==false;
    if(modId&&pla&&num) acts.push({mod:modId,pla:pla,num:num,titol:titol,sub:sub,tags:tags,url:url,ppt:ppt,actiu:actiu});
  });
  var r=await call('saveExemplesConfig',{mods:mods,acts:acts});
  if(!r.ok) return showError(r.error);
  toast('Configuració desada.');
  renderExemplesAdmin();
}
async function saveExemplesAdminOld(){
  var cfg={};
  EX_MODS.forEach(function(m){ var el=$('ex_'+m.id); cfg[m.id]=el?el.checked:true; });
  var r=await call('saveExemplesConfig',{config:cfg});
  if(!r.ok) return showError(r.error);
  toast('Configuració desada.');
}
function openExemples(id){
  var ov=$('exemOverlay');
  var base=location.hostname.indexOf('github.io')>=0?(location.origin+location.pathname.replace(/\/[^\/]*$/,'')):'https://katwolo.github.io/EAS-CC';
  var src=_exemUrls[id]||null;
  if(!src) src=base+'/activitats CC/index.html#'+id;
  var pptMap=_pptUrls[id]||null;
  if(pptMap&&Object.keys(pptMap).length) src+=(src.indexOf('?')>=0?'&':'?')+'ppts='+encodeURIComponent(JSON.stringify(pptMap));
  $('exemActTitle').textContent=id;

function closeExemples(){

function drawRadar(canvas, values, color, pointColors){
  if(!canvas) return; var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,R=Math.min(W,H)/2-40,N=CAPS.length,max=10;
  var gs=getComputedStyle(document.body);
  var gridC=(gs.getPropertyValue('--grid')||'rgba(255,255,255,.08)').trim();
  var axisC=(gs.getPropertyValue('--axis')||'rgba(255,255,255,.12)').trim();
  ctx.clearRect(0,0,W,H); ctx.font='11px "JetBrains Mono",monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  function pt(i,r){var a=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];}
  ctx.strokeStyle=gridC;[0.25,0.5,0.75,1].forEach(function(f){ctx.beginPath();for(var i=0;i<=N;i++){var p=pt(i%N,R*f);if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);}ctx.stroke();});
  ctx.fillStyle='rgba(139,147,167,.95)';
  for(var i=0;i<N;i++){var pe=pt(i,R),pl=pt(i,R+18);ctx.strokeStyle=axisC;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(pe[0],pe[1]);ctx.stroke();ctx.fillText(CAP_ABBR[CAPS[i]]||CAPS[i].toUpperCase(),pl[0],pl[1]);}
  ctx.beginPath();for(var j=0;j<=N;j++){var idx=j%N;var v=Math.max(0,Math.min(max,values[idx]||0));var p=pt(idx,R*v/max);if(j===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);}ctx.closePath();
  ctx.fillStyle=hexA(color,.20);ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
  for(var k=0;k<N;k++){var v2=Math.max(0,Math.min(max,values[k]||0));var p2=pt(k,R*v2/max);ctx.beginPath();ctx.arc(p2[0],p2[1],5,0,2*Math.PI);ctx.fillStyle=(pointColors&&pointColors[k])||color;ctx.fill();}
}
function hexA(hex,a){hex=hex.replace('#','');var r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);return 'rgba('+r+','+g+','+b+','+a+')';}
